# Главный конфиг triema-masker.
#
# Приоритет источников: переменная окружения → этот файл → значение по
# умолчанию в коде. Поэтому в контейнере ничего править не нужно: всё
# переопределяется окружением, а этот файл остаётся читаемой картиной
# настроек проекта.
#
# Секретов здесь нет и не будет. Поля с суффиксом `_env` хранят ИМЯ
# переменной окружения, в которой лежит секрет, а не сам секрет.

application:
  port: 8000

# Слой обращения к модели. Провайдер выбирается одним полем, заменить
# GigaChat на локальную модель можно не трогая логику узлов графа.
#
#   fake      — детерминированные заглушки, работает без сети (дефолт)
#   cassette  — записанные ответы живой модели, для воспроизводимых ворот
#   gigachat  — GigaChat (Сбер)
#   openrouter — OpenRouter
#
# Профиль связывает провайдера, модель и тариф. Чтобы переключиться, меняйте
# только profile: стоимость в отчёте останется от выбранной модели, а не от
# предыдущей. Добавляйте профили для каждой нужной модели.
llm:
  profile: fake
  timeout_seconds: 60
  site_url: ""
  title: triema-masker
  cassette_directory: fixtures/llm/roles
  profiles:
    fake:
      provider: fake
      pricing: &pricing_unknown
        prompt_per_1k: null
        completion_per_1k: null
        currency: RUB
        verified_at: ""
    cassette:
      provider: cassette
      pricing: *pricing_unknown
    gigachat-max:
      provider: gigachat
      model: GigaChat-Max
      api_key_env: GIGACHAT_CREDENTIALS
      gigachat:
        scope: GIGACHAT_API_PERS
        temperature: 0.0001
        ca_bundle_file: ""
        insecure_skip_tls_verify: false
      # Базовый тариф GigaChat, названный владельцем продукта 10.09.2026:
      # 96 ₽ за миллион входных токенов и 289 ₽ за миллион выходных.
      # В конфиге тариф хранится на 1000 токенов, отсюда деление на 1000.
      # `verified_at` — дата, на которую цена сверена: тарифы меняются, и
      # отчёт со стоимостью обязан говорить, когда её последний раз
      # проверяли, а не выдавать старое число за текущее.
      pricing:
        prompt_per_1k: 0.096
        completion_per_1k: 0.289
        currency: RUB
        verified_at: "2026-09-10"
    # Дешёвый ориентир: сравнить GigaChat с моделью общего назначения.
    # Тариф с карточки модели OpenRouter на 10.09.2026, $ за 1000 токенов.
    openrouter-deepseek-flash:
      provider: openrouter
      model: deepseek/deepseek-v4.1-flash
      api_key_env: OPENROUTER_API_KEY
      openrouter:
        temperature: 0.0
      pricing:
        prompt_per_1k: 0.00015
        completion_per_1k: 0.0006
        currency: USD
        verified_at: "2026-09-10"

    # Потолок качества. Нужен не для продакшена, а чтобы ответить на вопрос,
    # ради которого затевался бенчмарк: роли уже насыщены эвристикой (0.833)
    # или GigaChat просто слаб (0.827)? Если сильная модель тоже даёт ≈0.83 —
    # задача насыщена, и LLM в ней не нужен никому.
    openrouter-deepseek-pro:
      provider: openrouter
      model: deepseek/deepseek-v4-pro-0813
      api_key_env: OPENROUTER_API_KEY
      openrouter:
        temperature: 0.0
      pricing:
        prompt_per_1k: 0.00058
        completion_per_1k: 0.00174
        currency: USD
        verified_at: "2026-09-10"

    openrouter-glm-5-3-flash:
      provider: openrouter
      model: z-ai/glm-5.3-flash
      api_key_env: OPENROUTER_API_KEY
      openrouter:
        temperature: 0.0
      pricing: *pricing_unknown

# Распознавание сканов. fake не ходит в сеть и не тянет веса — этого
# достаточно для тестов и ворот.
ocr:
  provider: rapid

# Локальные веса моделей.
models:
  gliner_path: models/gliner

# Веб-слой: нужен только API. Движок masker работает без базы и хранилища,
# из голой консоли, поэтому отсутствие этой секции ему не мешает.
web:
  database:
    host: localhost
    port: 5432
    name: masker
    user: masker
    password_env: POSTGRES_PASSWORD

  minio:
    endpoint: localhost:9000
    access_key_env: MINIO_ACCESS_KEY
    secret_key_env: MINIO_SECRET_KEY
    secure: false
    bucket: documents

  # cookie_secure требует HTTPS для refresh-токена: выключать только для
  # локальной разработки.
  jwt:
    secret_env: JWT_SECRET
    algorithm: HS256
    access_token_expire_minutes: 15
    refresh_token_expire_days: 30
    cookie_secure: true
