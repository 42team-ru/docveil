[project]
name = "triema-masker"
version = "0.1.0"
description = "Локальный мультиагентный обезличиватель тендерных документов"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.28",
    "python-docx>=1.2",
    "openpyxl>=3.1",
    "natasha>=1.6",
    "pytesseract>=0.3.13",
    "pillow>=12",
    "gigachat>=0.1",
    "pyyaml>=6",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=2",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "minio>=7.2",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pytest-mock>=3.15",
    "pytest-xdist>=3.6",
    "httpx2>=2.12",
    "ruff>=0.14",
    "mypy>=1.19",
]
gliner = [
    "gliner2[local]>=1.3.2",
    "peft>=0.17",
    "torch>=2.8",
]

[project.scripts]
masker = "masker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/masker", "src/api"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "e2e: ходит в сеть (настоящий GigaChat, живые модели). Отобрать: pytest -m e2e",
    "models: использует настоящие локальные модели (natasha). Отобрать: pytest -m models",
    "gliner: использует локальные веса GLiNER2. Отобрать: pytest -m gliner",
    "private: работает на реальных документах из fixtures/private. Отобрать: pytest -m private",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Проект русскоязычный: кириллица в строках и комментариях — норма, не опечатка.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Depends/Cookie — декларативная часть сигнатуры FastAPI, а не вычисления логики.
"src/api/core/deps.py" = ["B008"]
"src/api/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF не поставляет стабы — все ошибки в этих модулях артефакт библиотеки, а не логики.
module = [
    "masker.ingest.pdf_ingest",
    "masker.render.pdf_render",
    "masker.validate.parts",
    "masker.validate.pdf_layout",
]
ignore_errors = true
