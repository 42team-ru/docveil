[project]
name = "triema-masker"
dynamic = ["version"]
description = "Локальный мультиагентный обезличиватель тендерных документов"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.28",
    "python-docx>=1.2",
    "openpyxl>=3.1",
    "natasha>=1.6",
    "pytesseract>=0.3.13",
    # RapidOCR — обязательный фоллбек, если системный tesseract недоступен.
    # Веса скачиваются через paddleocr-extra или вручную в ~/.paddlex/.
    "rapidocr-onnxruntime>=1.4",
    "pillow>=12",
    "gigachat>=0.1",
    "jsonschema>=4.20",
    "pyyaml>=6",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=2",
    "langgraph-checkpoint-postgres>=3",
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "minio>=7.2",
    "python-multipart>=0.0.12",
    # pymorphy2 (транзитивная зависимость natasha) на импорте лезет в
    # pkg_resources (analyzer.py, utils.py). setuptools>=81 этот модуль уже
    # не поставляет — без пина сборка по uv.lock без extra `gliner` вообще
    # не тянет setuptools в venv, и любой тест с морфологией падает с
    # ModuleNotFoundError. Снять пин можно, когда natasha перейдёт на
    # pymorphy3 (не использует pkg_resources) или когда pymorphy2 сам
    # перестанет его импортировать.
    "setuptools<81",
    "textual>=6.6",
]

[project.optional-dependencies]
build = [
    # Нужен только в CI, где из CLI собирается самостоятельный файл для релиза;
    # обычные тесты и локальный запуск не должны тянуть упаковщик.
    "pyinstaller>=6.14",
]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pytest-mock>=3.15",
    "pytest-xdist>=3.6",
    "httpx2>=2.12",
    "aiosqlite>=0.20",
    "ruff>=0.14",
    "mypy>=1.19",
]
gliner = [
    "gliner2[local]==2.0.0",
    "peft>=0.17",
    "transformers==4.57.6",
    "torch==2.14.0+cpu",
    # Токенизатору mdeberta-v3 нужны protobuf и sentencepiece, но transformers
    # объявляет их необязательными. Без них загрузка падает на ImportError уже
    # внутри модели, и слой молча не возвращает ничего (см. Р10 в TASKS.md).
    "protobuf>=5.0",
    "sentencepiece>=0.2",
]
ocr = [
    # PaddleOCR 3.x — актуальный API (PP-OCRv5/v6). Веса кэшируются в
    # ~/.paddleocr/ на первый прогон, не в репе. MASKER_OCR=paddle.
    "paddleocr>=3.0",
    # EasyOCR (JaidedAI) — альтернативный нейронный движок на PyTorch.
    # Медленнее tesseract/rapid на CPU. MASKER_OCR=easy.
    # Веса скачиваются в ~/.EasyOCR/model/.
    "easyocr>=1.7",
]

[project.scripts]
# `docveil` — имя продукта и основная команда. `masker` оставлен рабочим
# псевдонимом: он зашит в скрипты, документацию и чужие заметки, и молча
# сломать его дороже, чем держать одну строку.
docveil = "masker.cli:main"
masker = "masker.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
tag-pattern = '^v(?P<version>\d+\.\d+\.\d+)$'
# До первого релизного тега локальная установка остаётся устанавливаемой.
# В CI релиза точную версию передаёт SETUPTOOLS_SCM_PRETEND_VERSION.
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/masker", "src/api"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
# hatch-vcs читает и commit, и теги: без них uv может переиспользовать wheel
# с версией предыдущей ревизии из CI-кеша.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "e2e: ходит в сеть (настоящий GigaChat, живые модели). Отобрать: pytest -m e2e",
    "models: использует настоящие локальные модели (natasha). Отобрать: pytest -m models",
    "gliner: использует локальные веса GLiNER2. Отобрать: pytest -m gliner",
    "asyncio: асинхронный тест (pytest-asyncio в строгом режиме)",
    "private: работает на реальных документах из fixtures/private. Отобрать: pytest -m private",
    "ocr: использует настоящий OCR-движок (PaddleOCR/Tesseract). Отобрать: pytest -m ocr",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Проект русскоязычный: кириллица в строках и комментариях — норма, не опечатка.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Depends/Cookie — декларативная часть сигнатуры FastAPI, а не вычисления логики.
"src/api/core/deps.py" = ["B008"]
"src/api/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF не поставляет стабы — все ошибки в этих модулях артефакт библиотеки, а не логики.
module = [
    "masker.ingest.pdf_ingest",
    "masker.ingest.scan_ingest",
    "masker.render.pdf_render",
    "masker.render.image_export",
    "masker.highlights.page_dims",
    "masker.validate.parts",
    "masker.validate.pdf_layout",
    "masker.validate.certificate",
]
ignore_errors = true

[[tool.mypy.overrides]]
# langgraph 1.2.11 + mypy 2.3: перегрузки StateGraph.add_node не сходятся с
# фабриками узлов (Callable[[State], dict[str, object]]), одновременно
# сигналя call-overload и arg-type. Реальная сигнатура каждого узла
# типизирована в nodes.py, поэтому здесь безопасно отключить проверку типов.
module = ["masker.graph.build"]
ignore_errors = true
