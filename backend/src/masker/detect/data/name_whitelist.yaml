version: 1
# Белый список для уровня уверенности «possible» (Р8, docs/plans TASKS.md).
#
# Назначение: заглавное имя собственное (org_name/person) в этом списке не
# понижается до «снять одним кликом» — это термин предметной области, а не
# сторона договора. Список — данные, а не код: пополняется без правки логики.
# Начат с покрытия негативного корпуса `fixtures/negative/` (ГОСТ/ТУ без
# единой PII) и типовых юридических формул договоров.
#
# Сравнение регистронезависимое (casefold), поэтому здесь достаточно одной
# канонической формы на термин — `whitelist.py` не хранит вариантов падежей
# сверх того, что реально встречается в текстах.
