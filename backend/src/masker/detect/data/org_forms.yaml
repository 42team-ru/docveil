version: 1
# МАОУ/МБОУ/МАДОУ/ГБОУ/МКУ — аббревиатуры муниципальных/государственных
# учреждений (школы, детсады) — тот же класс, что и остальные (план
# T2.2.2, шаг 6, Д11): сторона договора без кавычек, спана от Natasha нет.
abbreviations:
  [
    ООО, АО, ПАО, ЗАО, ОАО, НАО, ИП, ГУП, МУП, ФГУП, ФГБУ, АНО, НКО, ТСЖ,
    МАОУ, МБОУ, МАДОУ, ГБОУ, МКУ,
  ]
full_forms:
  - Общество с ограниченной ответственностью
  - Акционерное общество
  - Публичное акционерное общество
  - Закрытое акционерное общество
  - Открытое акционерное общество
  - Непубличное акционерное общество
  - Индивидуальный предприниматель
  - Государственное унитарное предприятие
  - Автономная некоммерческая организация
  # Формы, которые Natasha на реальных PDF иногда отдаёт отдельным спаном —
  # без ведущего слова («Общество с», «Муниципальное автономное
  # общеобразовательное учреждение гимназия...» режется по-разному в
  # зависимости от длины строки). Без записи здесь `is_organization_form_only`
  # не отбрасывает остаток, а `expand_org_span` не находит форму на конце
  # спана, чтобы расширяться вправо в кавычки (план T2.2.1, шаг 5, Д5).
  - Ограниченной Ответственностью
  - Муниципальное автономное общеобразовательное учреждение
