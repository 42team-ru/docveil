version: 1
# Роли сторон договора — используется только для проверки меток, добытых
# регуляркой SIGNATURE (`profile/labels.py::SIGNATURE`, план И2-1). PREAMBLE
# и REQUISITES роль стороны получают из формулировки документа напрямую и
# этот список не используют.
#
# Это НЕ то же самое, что `detect/data/org_forms.yaml::role_stems`: там в
# одну кучу свалены роли сторон («поставщик») и должности/нарицательные
# слова («директор», «наименование») — там это нужно, чтобы отрезать слово
# от ФИО или оргформы, а не различать роль стороны. Здесь список — только
# существительные, которые называют САМУ сторону договора, а не того, кто
# подписывает от её имени, и не заголовок таблицы/раздела.
#
# Формат — усечённые основы (без падежного окончания), а не словоформы:
# `SIGNATURE` обычно захватывает именительный падеж («Поставщик:»), но
# основа даёт запас на случай, если где-то попадётся склонённая форма
# («Поставщика:» в таблице реквизитов, которую случайно поймает SIGNATURE,
# а не REQUISITES).
role_stems:
  - поставщик
  - покупател
  - заказчик
  - исполнител
  - арендатор
  - арендодател
  - подрядчик
  - продавец
  - продавц
  - потребител
  - перевозчик
  - отправител
  - получател
  - страховател
  - страховщик
  - выгодоприобретател
  - лизингодател
  - лизингополучател
  - правообладател
  - лицензиат
  - лицензиар
  - залогодержател
  - взыскател
  - кредитор
  - должник
  - клиент
  - туроператор
  - турагент
  - агент
  - принципал
  - цедент
  - цессионари
