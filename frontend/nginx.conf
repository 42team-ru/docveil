server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Тип для ES-модулей. nginx о расширении `.mjs` не знает и отдаёт такой
    # файл как `application/octet-stream`, а браузер по спецификации
    # отказывается исполнять модуль с неверным MIME:
    #
    #   Failed to load module script: Expected a JavaScript-or-Wasm module
    #   script but the server responded with a MIME type of
    #   "application/octet-stream"
    #
    # На этом ломался воркер pdf.js (`pdf.worker.min-*.mjs`): просмотрщик
    # молча откатывался на «fake worker», то есть разбирал PDF в основном
    # потоке страницы. Воспроизведено на стенде 14.09.2026.
    # `include` обязателен: блок `types` в server ЗАМЕЩАЕТ унаследованную от
    # http таблицу целиком, а не дополняет её. Без этой строки обычный `.js`
    # сам поехал бы как `application/octet-stream` — поймано проверкой
    # 14.09.2026, до того как попало на стенд.
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # `.mjs` входит в список наравне с `.js`: иначе воркер pdf.js
    # перезапрашивался бы при каждом открытии документа.
    location ~* \.(js|mjs|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
