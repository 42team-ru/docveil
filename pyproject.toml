[project]
name = "triema-masker"
version = "0.1.0"
description = "Локальный мультиагентный обезличиватель тендерных документов"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.28",
    "python-docx>=1.2",
    "openpyxl>=3.1",
    "natasha>=1.6",
    "pytesseract>=0.3.13",
    "pillow>=12",
    "gigachat>=0.1",
    "pyyaml>=6",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=2",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.14", "mypy>=1.19"]

[project.scripts]
masker = "masker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/masker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "e2e: ходит в сеть (настоящий GigaChat, живые модели). Отобрать: pytest -m e2e",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Проект русскоязычный: кириллица в строках и комментариях — норма, не опечатка.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
ignore_missing_imports = true
